name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          swift --version
          node --version
      - name: Unit tests, with the app's upload client talking to a real hub
        env:
          BIBTIMER_HUB_URL: http://127.0.0.1:8791
          BIBTIMER_HUB_KEY: ci-integration-key
        run: |
          PORT=8791 HUB_KEY="$BIBTIMER_HUB_KEY" DATA_DIR=/tmp/hub-data node hub/server.js &
          sleep 2
          swift test

  hub:
    name: Results hub (Node tests, Docker image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        working-directory: hub
        run: node --test
      - name: Build the image the hosting service builds, and start it
        run: |
          docker build -t bib-timer-hub .
          docker run -d --name hub -p 8080:8080 -e HUB_KEY=ci-image-check-key bib-timer-hub
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/health && break
            sleep 1
          done
          echo
          curl -fsS -H "Authorization: Bearer ci-image-check-key" http://127.0.0.1:8080/api/ping
          echo
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          docker logs hub

  apple:
    name: Tests and iOS build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Unit tests, including text recognition and the NTP client
        run: swift test
      - name: Compile every app source file for iOS
        if: success() || failure()
        run: |
          set -o pipefail
          mkdir -p .build
          xcodebuild build \
            -scheme BibTimerKit \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/xcode \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee .build/xcodebuild-ios.log | grep -E "error|warning: unre|BUILD|^\*\*" || true
          grep -q "BUILD SUCCEEDED" .build/xcodebuild-ios.log
      - name: Build the app project itself for the iOS Simulator
        if: success() || failure()
        working-directory: BibTimer.swiftpm
        run: |
          set -o pipefail
          mkdir -p ../.build
          xcodebuild build \
            -scheme BibTimer \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../.build/xcode-app \
            CODE_SIGNING_ALLOWED=NO \
            | tee ../.build/xcodebuild-app.log | grep -E "error|BUILD|^\*\*" || true
          grep -q "BUILD SUCCEEDED" ../.build/xcodebuild-app.log
      - name: Show build errors
        if: failure()
        run: |
          for log in .build/xcodebuild-ios.log .build/xcodebuild-app.log; do
            if [ -f "$log" ]; then
              echo "::group::$log"
              grep -n -E "error:|error |fatal|BUILD FAILED" -A 6 "$log" | head -400 || true
              echo "::endgroup::"
            fi
          done
